name: Qodana Quick-Fix (manual)

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "Start with cleanup; apply may make broader code changes"
        required: true
        type: choice
        default: cleanup
        options:
          - cleanup
          - apply

jobs:
  quickfix:
    # Never run this workflow on main or the reusable demo seed.
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'demo/live-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - name: Checkout selected demo branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Qodana Quick-Fix
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: false
          args: ${{ inputs.strategy == 'apply' && '--baseline baseline.sarif.json --apply-fixes' || '--baseline baseline.sarif.json --cleanup' }}
          push-fixes: pull-request
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: https://qodana.cloud
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
